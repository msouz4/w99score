services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_app
    restart: always
    ports:
      - "${PORT_WEB:-8080}:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-w99score_db}
      - DB_USER=${MYSQL_USER:-w99_db_user}
      - DB_PASS=${MYSQL_PASSWORD:-w99_db_sec_pass_2026!}
      - INGEST_API_KEY=${INGEST_API_KEY:-w99_sec_99a8b7c6d5e4f321}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-w99_root_sec_pass_2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-w99score_db}
      MYSQL_USER: ${MYSQL_USER:-w99_db_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-w99_db_sec_pass_2026!}
    ports:
      - "${PORT_DB:-33061}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "${PORT_PMA:-8081}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-w99_root_sec_pass_2026!}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
